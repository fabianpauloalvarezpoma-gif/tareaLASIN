<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desafío de Simuladores</title>
    <style>
        /* Estilos básicos aplicando el Box Model */
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .contenedor { 
            background: white; 
            max-width: 400px; 
            margin: 20px auto; 
            padding: 20px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
        }
        input { width: 90%; margin: 5px 0; padding: 8px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
        .salida { margin-top: 15px; padding: 10px; background: #e9ecef; border-left: 5px solid #007bff; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Simulador de Calor</h2>
        <form>
            <label>Temperatura Inicial (T0):</label> <input type="number" id="t0" value="120">
            <label>Temperatura del Entorno (Ts):</label> <input type="number" id="ts" value="38">
            <label> Constante (k):</label> <input type="number" id="k" step="0.01" value="0.45">
            <label>Tiempo en horas (t):</label> <input type="number" id="t" value="3">
            <button type="button" onclick="calcularCalor()">Calcular Temperatura</button>
        </form>
        <div id="resultado1" class="salida">Resultado: -</div>
    </div>

    <div class="contenedor">
        <h2>Calculador de Sorteo</h2>
        <form>
            <label>Grupo 1 (n1, r1):</label> 
            <input type="number" id="n1" value="59"> <input type="number" id="r1" value="5">
            <label>Grupo 2 (n2, r2):</label> 
            <input type="number" id="n2" value="35"> <input type="number" id="r2" value="1">
            <button type="button" onclick="calcularSorteo()">Calcular Combinaciones</button>
        </form>
        <div id="resultado2" class="salida">Resultado: -</div>
    </div>

    <script>
        // Lógica Ejercicio 1
        function calcularCalor() {
            let T0 = parseFloat(document.getElementById("t0").valude;
            let Ts = parseFloat(document.getElementById("ts").value);
            let k = parseFloat(document.getElementById("k").value);
            let t = parseFloat(document.getElementById("t").value);
            
            // Fórmula: T = Ts + (T0-Ts)* e^(-k*t) [cite: 15]
            let res = Ts + (T0 - Ts) * Math.exp(-k * t);
            document.getElementById("resultado1").innerHTML = "Temperatura Final: " + Math.round(res);
        }

        // Lógica Ejercicio 2
        function factorial(n) {
            let f = 1;
            for(let i = 1; i <= n; i++) { f = f * i; }
            return f;
        }

        function calcularSorteo() {
            let n1 = parseInt(document.getElementById("n1").value);
            let r1 = parseInt(document.getElementById("r1").value);
            let n2 = parseInt(document.getElementById("n2").value);
            let r2 = parseInt(document.getElementById("r2").value);

            // Validar que r no sea mayor a n 
            if(r1 > n1 || r2 > n2) {
                document.getElementById("resultado2").innerHTML = "Error: r no puede ser mayor que n";
            } else {
                // Cálculo C(n,r) = n! / (r! * (n-r)!) [cite: 23]
                let c1 = factorial(n1) / (factorial(r1) * factorial(n1 - r1));
                let c2 = factorial(n2) / (factorial(r2) * factorial(n2 - r2));
                document.getElementById("resultado2").innerHTML = "Total: " + (c1 * c2);
            }
        }
    </script>
</body>
</html>
